name: Build & Release

on:
  push:
    tags:
      - 'v*'              # 推送 tag 如 v0.1.6 时触发
  workflow_dispatch:       # 也支持手动触发
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.6)'
        required: false
        default: ''

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all versions with Stonecutter
        run: |
          chmod +x ./gradlew
          ./gradlew chiseledBuild --no-daemon --stacktrace

      - name: Collect release artifacts
        run: ./gradlew collectReleaseArtifacts --no-daemon

      - name: List release artifacts
        run: |
          echo "=== Release artifacts ==="
          find build/release -type f -name "*.jar" | sort | while read f; do
            echo "$f ($(du -h "$f" | cut -f1))"
          done

      - name: Determine tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "${{ steps.tag.outputs.TAG }} - DyDanmaku"
          body: |
            ## 🔧 DyDanmaku ${{ steps.tag.outputs.TAG }}

            支持以下 Minecraft 版本：
            - 1.20.1 ~ 1.20.6
            - 1.21 ~ 1.21.11
            - 26.1 ~ 26.1.2

            ### 📦 文件说明
            | 文件类型 | 说明 |
            |---|---|
            | `*-all.jar` | 包含所有依赖的 fat JAR |
            | `*-sources.jar` | 源代码 JAR |
            | 其他 `.jar` | 标准构建产物 |

            请根据你的 Minecraft 版本选择对应的 JAR 文件。
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/release/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
