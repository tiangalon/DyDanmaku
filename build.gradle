plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT' apply false
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.4.1'
}

version = property("mod.version") as String
group = property("mod.group") as String
def modName = property("mod.name") as String
def gameVersion = sc.current.version
def fabricLoader = property("fabric_loader") as String
def fabricApi = property("fabric_api") as String
def yarnMappings = null
if (sc.current.parsed <= "1.21.11") {
    yarnMappings = property("yarn_mappings") as String
}

if(sc.current.parsed < "26.1"){
    project.plugins.apply('net.fabricmc.fabric-loom-remap')
} else {
    project.plugins.apply('net.fabricmc.fabric-loom')
}

base {
    archivesName = modName as String + "-" +  "fabric" + "-" + sc.current.version
}

java {
    toolchain {
        if (sc.current.parsed <= "1.21.11") {
            languageVersion = JavaLanguageVersion.of(22)
        } else {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft("com.mojang:minecraft:${gameVersion}")
    if (sc.current.parsed < "26.1") {
        //mappings("net.fabricmc:yarn:${yarnMappings}:v2")
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${fabricLoader}"

        // Fabric API. This is technically optional, but you probably want it anyway.
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
    } else {
        implementation "net.fabricmc:fabric-loader:${fabricLoader}"

        // Fabric API. This is technically optional, but you probably want it anyway.
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
    }


    // https://mvnrepository.com/artifact/com.google.protobuf/protobuf-java
    implementation 'com.google.protobuf:protobuf-java:4.27.2'
    implementation 'io.netty:netty-codec-http:4.1.81.Final'
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
    implementation 'org.openjdk.nashorn:nashorn-core:15.4'
    if (sc.current.parsed >= "1.21.11") {
        implementation 'org.apache.httpcomponents:httpclient:4.5.14'
        implementation 'org.apache.httpcomponents:httpcore:4.4.16'
        implementation 'commons-logging:commons-logging:1.3.1'
    }


}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", gameVersion
    inputs.property "loader_version", fabricLoader
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": version,
                "minecraft_version": gameVersion,
                "loader_version": fabricLoader
        if (sc.current.parsed >= "26.1") {
            filter { String line -> line.replaceAll(/.*__FABRIC_DEP_LINE__.*/, '') }
        } else {
            filter { String line -> line.replaceAll(/.*__FABRIC_DEP_LINE__.*/, '    "fabric" : "*",') }
        }
    }
}

def targetJavaVersion = 21
if (sc.current.parsed <= "1.20.4" && sc.current.parsed >= "1.17") {
    targetJavaVersion = 17
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

shadowJar {
    // 26.1+ 使用 fabric-loom（非 remap），shadowJar 作为最终产物，不加分类器
    // < 26.1 使用 fabric-loom-remap，shadowJar 输出带 -all 分类器，供 remapJar 处理
    if (sc.current.parsed >= "26.1") {
        archiveClassifier.set('')
    } else {
        archiveClassifier.set('all')
    }
    dependencies{
        include(dependency('com.google.protobuf:protobuf-java:4.27.2'))
        include(dependency('io.netty:netty-codec-http:4.1.81.Final'))
        include(dependency('com.moandjiezana.toml:toml4j:0.7.2'))
        include(dependency('org.openjdk.nashorn:nashorn-core:15.4'))
        if (sc.current.parsed >= "1.21.11") {
            include(dependency('org.apache.httpcomponents:httpclient:4.5.14'))
            include(dependency('org.apache.httpcomponents:httpcore:4.4.16'))
            include(dependency('commons-logging:commons-logging:1.3.1'))
        }
    }
}

if(sc.current.parsed <= "1.21.11"){
    remapJar {
        dependsOn(shadowJar)
        inputFile = tasks.shadowJar.archiveFile
    }
} else {
    // 26.1+ uses fabric-loom, shadowJar is the final build artifact
    // 禁用默认 jar task，避免与 shadowJar（无分类器）冲突
    tasks.named('jar').configure { enabled = false }
    tasks.named('build').configure { dependsOn(shadowJar) }
    tasks.named('assemble').configure { dependsOn(shadowJar) }
}



// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = modName
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

// ============================================================
// Unified output — all version JARs go to a single folder
// ============================================================
def allJarsDir = rootProject.layout.buildDirectory.dir('all-jars')

afterEvaluate {
    if (sc.current.parsed < "26.1") {
        tasks.named('remapJar').configure {
            destinationDirectory = allJarsDir
        }
    } else {
        tasks.named('shadowJar').configure {
            destinationDirectory = allJarsDir
        }
    }
}

// ============================================================
// Release tasks — collect all version JARs for GitHub Releases
// ============================================================

tasks.register('collectReleaseArtifacts') {
    group = 'release'
    description = 'Collect all version JARs into build/release'

    doLast {
        def releaseDir = layout.buildDirectory.dir('release').get().asFile
        releaseDir.deleteDir()
        releaseDir.mkdirs()

        // Collect from the unified all-jars folder
        def unified = allJarsDir.get().asFile
        if (unified.exists()) {
            unified.eachFile { jarFile ->
                if (jarFile.name.endsWith('.jar')) {
                    def dest = new File(releaseDir, jarFile.name)
                    println "[release] ${jarFile.name} -> ${dest}"
                    java.nio.file.Files.copy(
                        jarFile.toPath(), dest.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                    )
                }
            }
        }

        // Also scan all version subdirectories for any remaining JARs
        def versionsRoot = rootProject.projectDir.toPath().resolve('versions')
        if (versionsRoot.toFile().exists()) {
            versionsRoot.toFile().eachDir { versionDir ->
                def libsDir = new File(versionDir, 'build/libs')
                if (libsDir.exists()) {
                    libsDir.eachFile { jarFile ->
                        if (jarFile.name.endsWith('.jar') && !jarFile.name.contains('-all.jar')) {
                            def dest = new File(releaseDir, jarFile.name)
                            println "[release] ${jarFile.name} -> ${dest}"
                            java.nio.file.Files.copy(
                                jarFile.toPath(), dest.toPath(),
                                java.nio.file.StandardCopyOption.REPLACE_EXISTING
                            )
                        }
                    }
                }
            }
        }

        // Also include root build/libs if present
        def rootLibs = layout.buildDirectory.dir('libs').get().asFile
        if (rootLibs.exists()) {
            rootLibs.eachFile { jarFile ->
                if (jarFile.name.endsWith('.jar') && !jarFile.name.contains('-all.jar')) {
                    def dest = new File(releaseDir, jarFile.name)
                    println "[release] root: ${jarFile.name} -> ${dest}"
                    java.nio.file.Files.copy(
                        jarFile.toPath(), dest.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                    )
                }
            }
        }

        // Generate a release manifest
        def infoFile = new File(releaseDir, 'release-info.txt')
        def jarList = releaseDir.listFiles()
            ?.findAll { it.name.endsWith('.jar') }
            ?.collect { "  - ${it.name} (${String.format('%.2f', it.length() / 1024 / 1024)} MB)" }
            ?.join('\n') ?: '  (no JARs found)'
        infoFile.text = """\
            |Release v${project.version}
            |Mod   : ${modName}
            |Group : ${project.group}
            |Date  : ${new Date().format('yyyy-MM-dd HH:mm:ss')}
            |
            |Artifacts:
            |${jarList}
            |""".stripMargin()

        println "\n[release] ${releaseDir.listFiles()?.size() ?: 0} files collected."
        println "[release] Output: ${releaseDir.absolutePath}"
    }
}

// Hook: ensure collectReleaseArtifacts runs after all subproject builds (when available)
gradle.projectsEvaluated {
    def allBuildTasks = subprojects.collect { it.tasks.findByName('build') }.findAll { it != null }
    if (!allBuildTasks.isEmpty()) {
        tasks.named('collectReleaseArtifacts').configure {
            dependsOn allBuildTasks
        }
    }
}

def void plugins(Closure<PluginDependencySpec> pluginDependencySpecClosure) {}